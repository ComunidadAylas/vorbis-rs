name: CI

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize

env:
  MSRV: "1.94.0"

  # Set up sccache with GitHub Actions cache
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: true

  # Deny warnings on CI without invalidating build caches, see:
  # https://blog.rust-lang.org/2026/07/09/Rust-1.97.0/#cargo-support-for-denying-warnings
  CARGO_BUILD_WARNINGS: deny

permissions:
  contents: read # For checking out the repository

concurrency:
  group: ci-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  msrv_check:
    name: MSRV check

    runs-on: ubuntu-26.04

    # Exclude in-repo PRs from running this job
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: 🧰 Install MSRV toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.MSRV }}

      - name: 💨 Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: ⚙️ Run tests
        run: cargo test -p ogg_next_sys -p aotuv_lancer_vorbis_sys -p vorbis_rs

  ci:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
          - target: x86_64-pc-windows-gnu
            runner: windows-2025
          - target: x86_64-apple-darwin
            runner: macos-26
          - target: aarch64-apple-darwin
            runner: macos-26

    name: CI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}

    # Exclude in-repo PRs from running this job
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork

    permissions:
      security-events: write # For uploading SARIF static analysis results

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: 🧰 Install Rust toolchain
        uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          target: ${{ matrix.target }}
          components: rust-src, rustfmt, clippy

      - name: 🧰 Install static analysis and documentation tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-docs-rs,clippy-sarif,sarif-fmt

      - name: 💨 Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: "🔍 Static analysis: run Clippy"
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -o pipefail
          cargo clippy --no-deps --all-targets --keep-going --message-format=json \
            | clippy-sarif \
            | tee /tmp/clippy-results.sarif \
            | sarif-fmt

      - name: "🔍 Static analysis: run rustfmt"
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --check --all

      - name: ✔️ Run tests
        run: cargo test --target ${{ matrix.target }} -- --nocapture

      - name: 📚 Build documentation
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          for package in vorbis_rs ogg_next_sys aotuv_lancer_vorbis_sys; do
            cargo docs-rs -p "$package"
          done
          cargo doc --workspace --no-deps

      - name: 📤 Upload Clippy static analysis results
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          sarif_file: /tmp/clippy-results.sarif
          category: clippy
